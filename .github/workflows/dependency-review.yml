name: "Dependency Review"

on:
  pull_request:
    branches: [ "main", "master" ]
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base branch (required for manual trigger)'
        required: true
        default: 'main'
      head_ref:
        description: 'Head branch (required for manual trigger)'
        required: true
        default: 'develop'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: critical
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          retry-on-snapshot-warnings: false
          retry-on-snapshot-warnings-timeout: 120
          # Use inputs from workflow_dispatch when manually triggered
          base-ref: ${{ github.event.inputs.base_ref || github.base_ref }}
          head-ref: ${{ github.event.inputs.head_ref || github.head_ref }}
